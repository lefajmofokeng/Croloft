<style>
   * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
</style>

<script>
class TechProfileHero extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }

  connectedCallback() {
    this.render();
  }

  render() {
    this.shadowRoot.innerHTML = `
      <style>

        :host {
          display: block;
          font-family: 'Circular Std', sans-serif;
          background-color: #f4f4f4;
          margin: 0;
          padding: 0;
          width: 100%;
          overflow-x: hidden;
        }

        /* 1200px Centered Container */
        .mj-container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 150px 20px 20px 20px;
          box-sizing: border-box;
        }

        /* Desktop Grid: 3 Columns */
        .mj-top-grid {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          gap: 20px;
          align-items: start;
          margin-bottom: 40px;
        }

        .mj-greeting {
          font-size: 28px;
          font-weight: 600;
          color: #000;
          margin: 0;
          font-family: 'Sunflare', sans-serif;
        }

        /* Hide this name span on desktop */
        .mj-inline-name {
          display: none;
        }

        .mj-info-block h3 {
          font-size: 28px;
          font-weight: 500;
          margin: 0 0 15px 0;
          line-height: 1.1;
          font-family: 'Sunflare', sans-serif;
        }

        .mj-info-block p {
          font-size: 18px;
          line-height: 1.5;
          margin: 0;
          max-width: 280px;
        }

        /* Large Name - Desktop */
        .mj-desktop-name {
          font-size: clamp(80px, 12vw, 180px);
          font-weight: 500;
          line-height: 0.8;
          letter-spacing: -0.05em;
          margin: 0 0 60px 0;
          text-align: left;
          font-family: 'Sunflare', sans-serif;
        }

        /* Full Width Image */
        .mj-image-full {
          width: 100%;
          margin-left: calc(-50vw + 50%);
          height: 700px;
          background-color: #f5f5f5;
        }

        .mj-image-full img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }

        /* Mobile View Logic */
        @media (max-width: 768px) {
          .mj-top-grid {
            grid-template-columns: 1fr; /* Stack the blocks */
            gap: 40px;
          }

          /* Show name next to greeting on mobile */
          .mj-greeting {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
          }

          .mj-inline-name {
            display: inline;
            color: #000;
          }

          /* Hide the giant bottom name on mobile since it's now in the greeting */
          .mj-desktop-name {
            display: none;
          }

          .mj-container {
            padding-top: 40px;
          }

          .mj-image-full {
            height: 50vh;
            margin-top: 20px;
          }
        }
      </style>

      <div class="mj-wrapper">
        <div class="mj-container">
          <div class="mj-top-grid">
            <h2 class="mj-greeting">
              Hey there, I’m <span class="mj-inline-name">lefa Mofokeng</span>
            </h2>

            <div class="mj-info-block">
              <h3>Cloud Solutions &<br>Network Security</h3>
              <p>Specializing in enterprise-scale infrastructure and automated deployment pipelines for modern tech stacks.</p>
            </div>

            <div class="mj-info-block">
              <h3>Based in<br>Washington DC</h3>
              <p>Designing robust technical frameworks that bridge the gap between complex code and user-centric efficiency.</p>
            </div>
          </div>

          <h1 class="mj-desktop-name">Lefa Mofokeng</h1>
        </div>

        <div class="mj-image-full">
          <img src="thumbnails/untitled.png" alt="Technology Background">
        </div>
      </div>
    `;
  }
}

customElements.define('it-profile-hero', TechProfileHero);
</script>
