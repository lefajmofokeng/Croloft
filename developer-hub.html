<maluti-cta-section></maluti-cta-section>

<script>
class MalutiCtaSection extends HTMLElement {
    constructor() {
        super();
        this.attachShadow({ mode: 'open' });
    }

    connectedCallback() {
        this.shadowRoot.innerHTML = `
            <style>
              @font-face { font-family:'Circular Std'; src:url('fonts/CircularStd-Book.woff2') format('woff2'),url('fonts/CircularStd-Book.woff') format('woff'); font-weight:400; font-style:normal; font-display:swap; }
              @font-face { font-family:'Circular Std'; src:url('fonts/CircularStd-BookItalic.woff2') format('woff2'),url('fonts/CircularStd-BookItalic.woff') format('woff'); font-weight:400; font-style:italic; font-display:swap; }
              @font-face { font-family:'Circular Std'; src:url('fonts/CircularStd-Medium.woff2') format('woff2'),url('fonts/CircularStd-Medium.woff') format('woff'); font-weight:500; font-style:normal; font-display:swap; }
              @font-face { font-family:'Circular Std'; src:url('fonts/CircularStd-Bold.woff2') format('woff2'),url('fonts/CircularStd-Bold.woff') format('woff'); font-weight:600; font-style:normal; font-display:swap; }
              @font-face { font-family:'Circular Std'; src:url('fonts/CircularStd-Bold.woff2') format('woff2'),url('fonts/CircularStd-Bold.woff') format('woff'); font-weight:700; font-style:normal; font-display:swap; }
              @font-face { font-family:'Circular Std'; src:url('fonts/CircularStd-Black.woff2') format('woff2'),url('fonts/CircularStd-Black.woff') format('woff'); font-weight:800; font-style:normal; font-display:swap; }
              @font-face { font-family:'Circular Std'; src:url('fonts/CircularStd-Black.woff2') format('woff2'),url('fonts/CircularStd-Black.woff') format('woff'); font-weight:900; font-style:normal; font-display:swap; }
              
                :host {
                    display: block;
                    background-color: #ededed;
                    font-family: 'Circular Std', sans-serif;
                    padding: 4rem 1rem;
                    position: relative;
                    overflow: hidden;
                }

                * {
                    box-sizing: border-box;
                    margin: 0;
                    padding: 0; 
                }

                /* Layout Constraint matching your 1200px footprint */
                .blueprint-container {
                    max-width: 1200px;
                    margin: 150px auto;
                    position: relative;
                    min-height: 550px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                /* --- Geometric Blueprint Vector Guides with Linear-Gradient End Fading --- */
                .guide-line {
                    position: absolute;
                    z-index: 1;
                }

                /* Horizontal Lines: Pushed further out to 10% to create clear headroom and footroom */
                .guide-line.horizontal {
                    height: 1px;
                    left: 2%;
                    right: 2%;
                    background-image: linear-gradient(to right, #5142be 3px, transparent 3px);
                    background-size: 8px 1px;
                    -webkit-mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent);
                    mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent);
                }

                .guide-line.horizontal-top {
                    top: 10%;
                }

                .guide-line.horizontal-bottom {
                    bottom: 10%;
                }

                /* Vertical Lines */
                .guide-line.vertical {
                    width: 1px;
                    top: 2%;
                    bottom: 2%;
                    background-image: linear-gradient(to bottom, #5142be 3px, transparent 3px);
                    background-size: 1px 8px;
                    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 15%, #000 85%, transparent);
                    mask-image: linear-gradient(to bottom, transparent, #000 15%, #000 85%, transparent);
                }

                .guide-line.vertical-left {
                    left: 15%;
                }

                .guide-line.vertical-right {
                    right: 15%;
                }

                /* Architectural Node Points matching the intersect areas */
                .blueprint-node {
                    position: absolute;
                    width: 14px;
                    height: 14px;
                    background-color: #5142be;
                    border: 3px solid #ededed;
                    border-radius: 50%;
                    z-index: 2;
                    box-shadow: 0 0 0 3px rgba(81, 66, 190, 0.2);
                }

                .node-top-left {
                    top: calc(10% - 7px);
                    left: calc(15% - 7px);
                }

                .node-bottom-right {
                    bottom: calc(10% - 7px);
                    right: calc(15% - 7px);
                }

                /* --- Content Panel Block (Strict Spacing Isolation) --- */
                .content-box {
                    position: relative;
                    z-index: 3;
                    max-width: 650px;
                    text-align: center;
                    
                    /* Generous inner padding to hold content away from boundaries */
                    padding: 4rem 3rem; 
                    
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                }

                /* Specialized Mini Label Bracket Wrapper Container */
                .badge-wrapper {
                    position: relative;
                    padding: 0.4rem 0.8rem;
                    margin-bottom: 1.75rem;
                }

                .badge-wrapper::before {
                    content: '';
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 6px;
                    height: 6px;
                    border-top: 1px solid #5142be;
                    border-left: 1px solid #5142be;
                }

                .badge-wrapper::after {
                    content: '';
                    position: absolute;
                    bottom: 0;
                    right: 0;
                    width: 6px;
                    height: 6px;
                    border-bottom: 1px solid #5142be;
                    border-right: 1px solid #5142be;
                }

                .badge-text {
                    font-family: 'Circular Std', sans-serif;
                    font-size: 0.813rem;
                    font-weight: 700;
                    text-transform: uppercase;
                    letter-spacing: 0.05em;
                    color: #5142be;
                }

                /* Typography Layout */
                .headline {
                    font-family: 'Circular Std', sans-serif;
                    font-size: 3.25rem;
                    font-weight: 700;
                    line-height: 1.15;
                    letter-spacing: -0.03em;
                    color: #2b2b2b;
                    margin-bottom: 1.5rem;
                }

                .description {
                    font-size: 1.05rem;
                    line-height: 1.6;
                    color: #555555;
                    margin-bottom: 2.5rem;
                    max-width: 580px;
                }

                /* --- Buttons Matrix Actions --- */
                .action-group {
                    display: flex;
                    gap: 1rem;
                    align-items: center;
                }

                .btn {
                    font-family: 'Circular Std', sans-serif;
                    font-size: 0.938rem;
                    font-weight: 600;
                    padding: 0.8rem 1.5rem;
                    border-radius: 6px;
                    cursor: pointer;
                    display: inline-flex;
                    align-items: center;
                    gap: 0.5rem;
                    text-decoration: none;
                    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease;
                    border: none;
                }

                .btn:hover {
                    transform: translateY(-2px);
                    filter: brightness(0.95);
                }

                .btn-primary {
                    background-color: #5142be;
                    color: #ffffff;
                }

                .btn-secondary {
                    background-color: #ffc914;
                    color: #1a1a1a;
                }

                .btn svg {
                    width: 16px;
                    height: 16px;
                    fill: currentColor;
                }

                /* --- Responsive Breakpoint Optimization Scaling --- */
                @media (max-width: 768px) {
                    .content-box {
                        padding: 2rem 1rem;
                    }
                    .headline {
                        font-size: 2.25rem;
                    }
                    .action-group {
                        flex-direction: column;
                        width: 100%;
                    }
                    .btn {
                        width: 100%;
                        justify-content: center;
                    }
                    .guide-line.vertical {
                        display: none;
                    }
                    .blueprint-node {
                        display: none;
                    }
                }
            </style>

            <div class="blueprint-container">
                
                <div class="guide-line horizontal horizontal-top"></div>
                <div class="guide-line horizontal horizontal-bottom"></div>
                <div class="guide-line vertical vertical-left"></div>
                <div class="guide-line vertical vertical-right"></div>

                <div class="blueprint-node node-top-left"></div>
                <div class="blueprint-node node-bottom-right"></div>

                <div class="content-box">
                    
                    <div class="badge-wrapper">
                        <span class="badge-text">Join Our Community Now</span>
                    </div>

                    <h2 class="headline">Start Learning Today.</h2>
                    
                    <p class="description">
                        Stop guessing about your communication weaknesses. Take the first step toward influential leadership by booking a personalized consultation with us.
                    </p>

                    <div class="action-group">
                        <a href="#" class="btn btn-primary">
                            Enroll Now
                            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                        </a>
                        <a href="#" class="btn btn-secondary">
                            Start Free Courses
                            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                        </a>
                    </div>

                </div>

            </div>
        `;
    }
}

customElements.define('maluti-cta-section', MalutiCtaSection);
</script>
