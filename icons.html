<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYPE — Launch Your Essentials Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* RESET & CORE VARIABLES */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #07090e;
      --bg-surface: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --container-max: 1200px;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* BACKGROUND GLOW DECORATION */
    .bg-glow {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(7, 9, 14, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAVBAR */
    .navbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-weight: 800;
      font-size: 1.65rem;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 40%, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.925rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.25rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-ghost {
      color: var(--text-main);
      background: transparent;
    }

    .btn-ghost:hover {
      color: #ffffff;
      background: var(--bg-surface);
    }

    .btn-secondary {
      color: var(--text-main);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-primary {
      color: #ffffff;
      background: var(--accent-primary);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-lg {
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      border-radius: 60px;
    }

    /* HERO SECTION */
    .hero {
      position: relative;
      z-index: 1;
      padding: 6rem 0 5rem;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .hero-badge span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-primary);
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      max-width: 800px;
      margin: 0 auto 1.5rem;
      color: #ffffff;
    }

    .hero-title span {
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 2.5rem;
      font-weight: 400;
    }

    .hero-ctas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .nav-links {
        display: none; /* Add a mobile drawer/toggle as needed */
      }

      .hero-title {
        font-size: 2.35rem;
      }

      .hero-desc {
        font-size: 1rem;
      }

      .hero-ctas {
        flex-direction: column;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
      }

      .hero-ctas .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Background Radial Glow -->
  <div class="bg-glow"></div>

  <!-- Navbar -->
  <header class="container">
    <nav class="navbar">
      <a href="#" class="logo">HYPE</a>

      <ul class="nav-links">
        <li><a href="#features">Features</a></li>
        <li><a href="#solutions">Solutions</a></li>
        <li><a href="#pricing">Pricing</a></li>
        <li><a href="#resources">Resources</a></li>
      </ul>

      <div class="nav-actions">
        <a href="#login" class="btn btn-ghost">Log In</a>
        <a href="#create" class="btn btn-primary">Get Started</a>
      </div>
    </nav>
  </header>

  <!-- Hero Section -->
  <main class="container">
    <section class="hero">
      

      <h1 class="hero-title">
        Build your online store and sell <span>everyday essentials</span> seamlessly.
      </h1>

      <p class="hero-desc">
        HYPE gives you all the tools to launch, manage, and scale your essentials store in minutes. No complex code required.
      </p>

      <div class="hero-ctas">
        <a href="#create" class="btn btn-primary btn-lg">Create your store</a>
        <a href="#login" class="btn btn-secondary btn-lg">Login</a>
      </div>
    </section>
  </main>

</body>
</html>
